<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>NEON SLITHER - Ultimate Arena</title>
<script>
if (!location.search.includes("v=10")) {
  location.replace(location.pathname + "?v=10" + location.hash);
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
  body {
    background: #070A12; color: #F8FAFC; font-family: monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; overflow: hidden;
  }
  .card {
    background: #111827; border: 2px solid #1E293B; border-radius: 14px;
    padding: 24px 28px; text-align: center; width: 92%; max-width: 410px;
    box-shadow: 0 0 35px rgba(0, 240, 255, 0.12);
  }
  h1 { color: #00F0FF; font-size: 28px; letter-spacing: 3px; }
  .sub { color: #FF2A85; font-weight: bold; margin-bottom: 16px; }
  label { display: block; text-align: left; font-size: 11px; color: #94A3B8; }
  input {
    width: 100%; padding: 10px; margin: 5px 0 14px; border-radius: 6px;
    border: 1px solid #334155; background: #0B0F19; color: #00F0FF;
    font-family: monospace; font-size: 15px; outline: none;
  }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 6px;
    font-family: monospace; font-size: 13px; font-weight: bold;
    cursor: pointer; margin-bottom: 9px;
  }
  .btn-skin { background: #1E293B; color: #00F0FF; }
  .btn-solo { background: #39FF14; color: #0B0F19; }
  .btn-host { background: #00F0FF; color: #0B0F19; }
  .btn-join { background: #FF2A85; color: #FFF; }
  #status { color: #FBBF24; font-size: 12px; min-height: 18px; margin-top: 6px; }
  #hud {
    display: none; width: 96vw; max-width: 920px; justify-content: space-between;
    padding: 6px 4px; font-size: 14px; font-weight: bold;
  }
  #cornerCode {
    display: none; position: fixed; top: 12px; left: 14px;
    background: rgba(17, 24, 39, 0.92); border: 1.5px solid #FBBF24;
    color: #FBBF24; padding: 6px 12px; border-radius: 6px;
    font-size: 13px; font-weight: bold; cursor: pointer; z-index: 30;
  }
  canvas {
    display: none; width: 96vw; max-width: 920px; height: auto;
    background: #0B0F19; border: 3px solid #FF2A85; border-radius: 8px;
  }
  #touchControls {
    display: none; position: fixed; bottom: 18px; left: 0; right: 0;
    padding: 0 26px; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 20;
  }
  #joyBase {
    width: 110px; height: 110px; border-radius: 50%;
    background: rgba(30, 41, 59, 0.55); border: 2px solid #00F0FF;
    position: relative; pointer-events: auto;
  }
  #joyKnob {
    width: 44px; height: 44px; border-radius: 50%; background: #00F0FF;
    position: absolute; top: 31px; left: 31px; opacity: 0.85;
  }
  #touchBoost {
    width: 86px; height: 86px; border-radius: 50%; margin: 0;
    background: rgba(255, 42, 133, 0.75); border: 2px solid #FFF;
    color: #FFF; font-size: 13px; pointer-events: auto;
  }
</style>
</head>
<body>
<div id="lobby" class="card">
  <h1>NEON SLITHER</h1>
  <div class="sub">ULTIMATE MULTIPLAYER ARENA</div>
  <label>USERNAME</label>
  <input id="uname" maxlength="14">
  <button id="skinBtn" class="btn-skin">SKIN: CYAN PULSE [CHANGE]</button>
  <button id="soloBtn" class="btn-solo">PLAY SOLO (AI BOTS)</button>
  <button id="hostBtn" class="btn-host">CREATE 4-LETTER ROOM (HOST)</button>
  <label style="margin-top:8px;">OR ENTER 4-LETTER ROOM CODE</label>
  <input id="roomCodeIn" maxlength="4" placeholder="e.g. K8P2"
         style="text-transform:uppercase; color:#FBBF24; text-align:center;">
  <button id="joinBtn" class="btn-join">JOIN FRIEND'S ROOM</button>
  <div id="status"></div>
</div>
<div id="hud">
  <span id="massHud" style="color:#00F0FF;">MASS: 240</span>
  <span id="roomHud" style="color:#FBBF24;">MODE: SOLO</span>
  <span id="killHud" style="color:#FF2A85;">TAKEDOWNS: 0</span>
</div>
<div id="cornerCode" title="Click to copy Room Code">ROOM: ----</div>
<canvas id="arena" width="920" height="620"></canvas>
<div id="touchControls">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="touchBoost">BOOST</button>
</div>
<script>
const W = 920, H = 620, INIT_LEN = 24, ORB_MAX = 48, BOT_MAX = 5;
const SKINS = [
  { name: "CYAN PULSE", c: ["#00F0FF", "#00B8D4", "#00838F"] },
  { name: "MAGENTA WAVE", c: ["#FF2A85", "#D81B60", "#880E4F"] },
  { name: "TOXIC NEON", c: ["#39FF14", "#00C853", "#1B5E20"] },
  { name: "SOLAR FLARE", c: ["#FF9E00", "#F57C00", "#E65100"] },
  { name: "CYBER VIOLET", c: ["#B829EA", "#8E24AA", "#4A148C"] }
];
const ORB_COLS = ["#FF2A85", "#00F0FF", "#B829EA", "#39FF14", "#FF9E00"];
const BOT_NAMES = ["ViperX", "Nova", "Byte", "ZigZag", "Shadow", "Orbit"];

let skinIdx = 0, isHost = true, myId = "p1", dc = null;
let guestInput = null, state = { snakes: [], orbs: [], powerups: [], feed: [] };
let particles = [], keys = {}, desiredAng = 0, touchBoost = false;
let mouse = { x: W / 2, y: H / 2, active: false, down: false };

const unameEl = document.getElementById("uname");
const statusEl = document.getElementById("status");
unameEl.value = "Player_" + Math.floor(100 + Math.random() * 900);

document.getElementById("skinBtn").onclick = () => {
  skinIdx = (skinIdx + 1) % SKINS.length;
  const s = SKINS[skinIdx];
  const btn = document.getElementById("skinBtn");
  btn.textContent = `SKIN: ${s.name} [CHANGE]`;
  btn.style.color = s.c;
};

function makeSnake(id, name, skin, isBot = false) {
  const x = 130 + Math.random() * (W - 260);
  const y = 130 + Math.random() * (H - 260);
  const ang = Math.random() * Math.PI * 2;
  const pts = [];
  for (let i = 0; i < INIT_LEN; i++) {
    pts.push({ x: x - Math.cos(ang) * i * 6, y: y - Math.sin(ang) * i * 6 });
  }
  return {
    id, name, x, y, ang, mass: 240, skin, isBot, alive: true,
    boost: false, bCnt: 0, kills: 0, pts, aiT: 0, aiAng: ang,
    magT: 0, ghostT: 0
  };
}

function spawnOrb(x, y, big = false) {
  return {
    x: x ?? (25 + Math.random() * (W - 50)),
    y: y ?? (25 + Math.random() * (H - 50)),
    r: big ? 8 : 5, v: big ? 30 : 10,
    c: ORB_COLS[Math.floor(Math.random() * ORB_COLS.length)]
  };
}

function spawnPowerup() {
  const type = Math.random() < 0.5 ? "magnet" : "ghost";
  return {
    x: 45 + Math.random() * (W - 90),
    y: 45 + Math.random() * (H - 90),
    type, r: 12
  };
}

function initWorld(hostName) {
  state = { snakes: [], orbs: [], powerups: [], feed: [] };
  state.snakes.push(makeSnake("p1", hostName, skinIdx, false));
  for (let i = 0; i < ORB_MAX; i++) state.orbs.push(spawnOrb());
  for (let i = 0; i < 3; i++) state.powerups.push(spawnPowerup());
  for (let i = 0; i < BOT_MAX; i++) {
    state.snakes.push(makeSnake("bot_" + i, BOT_NAMES[i], i % SKINS.length, true));
  }
}

function launchGame(label, rawCode = "") {
  document.getElementById("lobby").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.getElementById("arena").style.display = "block";
  if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
    document.getElementById("touchControls").style.display = "flex";
  }
  document.getElementById("roomHud").textContent = label;
  if (rawCode) {
    const badge = document.getElementById("cornerCode");
    badge.style.display = "block";
    badge.textContent = "ROOM: " + rawCode + " [COPY]";
    badge.onclick = () => {
      navigator.clipboard?.writeText(rawCode);
      badge.textContent = "COPIED: " + rawCode;
      setTimeout(() => badge.textContent = "ROOM: " + rawCode + " [COPY]", 1500);
    };
  }
  requestAnimationFrame(loop);
}

document.getElementById("soloBtn").onclick = () => {
  isHost = true; myId = "p1";
  initWorld(unameEl.value.trim() || "Player");
  launchGame("MODE: SOLO ARENA");
};
function connectMqttRoom(roomCode, asHost) {
  if (asHost) {
    initWorld(unameEl.value.trim() || "Host");
    launchGame("ROOM CODE: " + roomCode, roomCode);
  }
  const brokers = [
    "wss://" + ["broker", "hivemq", "com"].join(".") + ":8884/mqtt",
    "wss://" + ["broker", "emqx", "io"].join(".") + ":8084/mqtt"
  ];
  let connected = false;
  brokers.forEach(url => {
    const ws = new WebSocket(url, "mqtt");
    ws.binaryType = "arraybuffer";
    const subTopic = "neonslither/" + roomCode + (asHost ? "/in" : "/out");
    const pubTopic = "neonslither/" + roomCode + (asHost ? "/out" : "/in");
    const encS = s => { const b = new TextEncoder().encode(s); return [b.length >> 8, b.length & 255, ...b]; };
    const encL = l => { const o = []; do { let d = l % 128; l = Math.floor(l / 128); if (l > 0) d |= 128; o.push(d); } while (l > 0); return o; };
    const relay = {
      readyState: "open",
      send(str) {
        if (ws.readyState !== 1) return;
        const body = [...encS(pubTopic), ...new TextEncoder().encode(str)];
        ws.send(new Uint8Array([0x30, ...encL(body.length), ...body]));
      }
    };
    ws.onopen = () => {
      if (connected) { ws.close(); return; }
      const cid = "ns_" + Math.random().toString(36).slice(2, 10);
      const body = [0, 4, 77, 81, 84, 84, 4, 2, 0, 60, ...encS(cid)];
      ws.send(new Uint8Array([0x10, ...encL(body.length), ...body]));
    };
    ws.onmessage = e => {
      const u = new Uint8Array(e.data), type = u >> 4;
      if (type === 2 && !connected) {
        connected = true;
        const sub = [0, 1, ...encS(subTopic), 0];
        ws.send(new Uint8Array([0x82, ...encL(sub.length), ...sub]));
        dc = relay;
        if (!asHost) {
          relay.send(JSON.stringify({ type: "hello", name: unameEl.value.trim() || "Guest", skin: skinIdx }));
          launchGame("ROOM: " + roomCode, roomCode);
        }
      } else if (type === 3) {
        let i = 1, m = 1, r = 0, b;
        do { b = u[i++]; r += (b & 127) * m; m *= 128; } while (b & 128);
        const tl = (u[i] << 8) | u[i + 1];
        const msg = JSON.parse(new TextDecoder().decode(u.slice(i + 2 + tl, i + r)));
        if (asHost) {
          if (msg.type === "hello") {
            state.snakes = state.snakes.filter(s => s.id !== "p2");
            state.snakes.push(makeSnake("p2", msg.name, msg.skin, false));
            pushFeed(`${msg.name} joined the arena!`);
          } else if (msg.type === "input") guestInput = msg;
        } else if (msg.type === "state") state = msg.data;
      }
    };
  });
}

  const encodeLen = len => {
    const out = [];
    do {
      let d = len % 128; len = Math.floor(len / 128);
      if (len > 0) d |= 128;
      out.push(d);
    } while (len > 0);
    return out;
  };

  const relay = {
    readyState: "connecting",
    send(jsonStr) {
      if (ws.readyState !== 1) return;
      const body = [...encodeStr(pubTopic), ...new TextEncoder().encode(jsonStr)];
      ws.send(new Uint8Array([0x30, ...encodeLen(body.length), ...body]));
    }
  };

  ws.onopen = () => {
    const cid = "ns_" + Math.random().toString(36).slice(2, 10);
    const body = [0, 4, 77, 81, 84, 84, 4, 2, 0, 60, ...encodeStr(cid)];
    ws.send(new Uint8Array([0x10, ...encodeLen(body.length), ...body]));
  };

  ws.onmessage = e => {
    const u = new Uint8Array(e.data);
    const type = u >> 4;
    if (type === 2) {
      const subBody = [0, 1, ...encodeStr(subTopic), 0];
      ws.send(new Uint8Array([0x82, ...encodeLen(subBody.length), ...subBody]));
      relay.readyState = "open";
      dc = relay;
      if (asHost) {
        initWorld(unameEl.value.trim() || "Host");
        launchGame("ROOM CODE: " + roomCode, roomCode);
      } else {
        const nm = unameEl.value.trim() || "Guest";
        relay.send(JSON.stringify({ type: "hello", name: nm, skin: skinIdx }));
        launchGame("ROOM: " + roomCode, roomCode);
      }
    } else if (type === 3) {
      let idx = 1, mult = 1, rem = 0, b;
      do { b = u[idx++]; rem += (b & 127) * mult; mult *= 128; } while (b & 128);
      const tLen = (u[idx] << 8) | u[idx + 1];
      const payload = new TextDecoder().decode(u.slice(idx + 2 + tLen, idx + rem));
      const msg = JSON.parse(payload);
      if (asHost) {
        if (msg.type === "hello") {
          state.snakes = state.snakes.filter(s => s.id !== "p2");
          state.snakes.push(makeSnake("p2", msg.name, msg.skin, false));
          pushFeed(`${msg.name} joined the arena!`);
        } else if (msg.type === "input") guestInput = msg;
      } else if (msg.type === "state") state = msg.data;
    }
  };
  ws.onerror = () => { statusEl.textContent = "Relay connection failed—try again."; };
}

document.getElementById("hostBtn").onclick = () => {
  isHost = true; myId = "p1";
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const code = Array.from({ length: 4 }, () =>
    chars[Math.floor(Math.random() * chars.length)]
  ).join("");
  statusEl.textContent = "Creating room " + code + "...";
  connectMqttRoom(code, true);
};

document.getElementById("joinBtn").onclick = () => {
  const code = document.getElementById("roomCodeIn").value.trim().toUpperCase();
  if (code.length !== 4) { statusEl.textContent = "Enter a 4-letter Room Code!"; return; }
  isHost = false; myId = "p2";
  statusEl.textContent = "Joining room " + code + "...";
  connectMqttRoom(code, false);
};
function turnTo(s, target, rate) {
  let diff = (target - s.ang + Math.PI) % (Math.PI * 2) - Math.PI;
  if (diff < -Math.PI) diff += Math.PI * 2;
  s.ang += Math.abs(diff) < rate ? diff : Math.sign(diff) * rate;
}

function addBurst(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, spd = 1.5 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 28, c: color });
  }
}

function pushFeed(text) {
  state.feed.unshift({ text, ttl: 180 });
  if (state.feed.length > 3) state.feed.pop();
}

function stepHost() {
  state.feed = state.feed.filter(f => --f.ttl > 0);
  for (let s of state.snakes) {
    if (!s.alive) continue;
    if (s.magT > 0) s.magT--;
    if (s.ghostT > 0) s.ghostT--;

    if (s.isBot) {
      let ax = 0, ay = 0, danger = false;
      if (s.x < 75) { ax = 1; danger = true; } else if (s.x > W - 75) { ax = -1; danger = true; }
      if (s.y < 75) { ay = 1; danger = true; } else if (s.y > H - 75) { ay = -1; danger = true; }
      if (danger) { s.aiAng = Math.atan2(ay, ax); s.boost = false; }
      else if (--s.aiT <= 0) {
        s.aiT = 18 + Math.floor(Math.random() * 18);
        const o = state.orbs[Math.floor(Math.random() * state.orbs.length)];
        if (o) s.aiAng = Math.atan2(o.y - s.y, o.x - s.x);
      }
      turnTo(s, s.aiAng, 0.05);
    } else {
      const inp = s.id === "p1" ? getLocalInput() : guestInput;
      if (inp) {
        if (inp.respawn && !s.alive) Object.assign(s, makeSnake(s.id, s.name, inp.skin));
        turnTo(s, inp.ang, 0.065);
        s.boost = inp.boost && s.mass > 150;
        s.skin = inp.skin;
      }
    }
    const spd = s.boost ? 3.9 : 2.1;
    if (s.boost && ++s.bCnt >= 22) {
      s.bCnt = 0; s.mass -= 10;
      const tail = s.pts[s.pts.length - 1];
      if (tail) state.orbs.push(spawnOrb(tail.x, tail.y, false));
    }
    s.x += Math.cos(s.ang) * spd; s.y += Math.sin(s.ang) * spd;
    s.pts.unshift({ x: s.x, y: s.y });
    const targetLen = INIT_LEN + Math.floor((s.mass - 240) / 12);
    while (s.pts.length > targetLen) s.pts.pop();

    const rad = Math.min(18, 9 + (targetLen - INIT_LEN) * 0.07);
    const pullRad = s.magT > 0 ? rad + 150 : rad + 42;
    const mult = s.magT > 0 ? 2 : 1;

    state.orbs = state.orbs.filter(o => {
      const d = Math.hypot(s.x - o.x, s.y - o.y);
      if (d < pullRad) { o.x += (s.x - o.x) * 0.18; o.y += (s.y - o.y) * 0.18; }
      if (d < rad + o.r + 7) { s.mass += o.v * mult; return false; }
      return true;
    });

    state.powerups = state.powerups.filter(p => {
      if (Math.hypot(s.x - p.x, s.y - p.y) < rad + p.r + 6) {
        if (p.type === "magnet") { s.magT = 480; pushFeed(`${s.name} activated 2X MAGNET!`); }
        else { s.ghostT = 360; pushFeed(`${s.name} activated GHOST PHASE!`); }
        addBurst(p.x, p.y, p.type === "magnet" ? "#FBBF24" : "#A855F7");
        return false;
      }
      return true;
    });
  }

  for (let s of state.snakes) {
    if (!s.alive) continue;
    const colMain = SKINS[s.skin % SKINS.length].c;
    if (s.x < 10 || s.x > W - 10 || s.y < 10 || s.y > H - 10) {
      s.alive = false; addBurst(s.x, s.y, colMain);
      s.pts.forEach((p, i) => { if (i % 3 === 0) state.orbs.push(spawnOrb(p.x, p.y, true)); });
      continue;
    }
    if (s.ghostT > 0) continue;
    for (let o of state.snakes) {
      if (o === s || !o.alive) continue;
      for (let i = 0; i < o.pts.length; i += 2) {
        if (Math.hypot(s.x - o.pts[i].x, s.y - o.pts[i].y) < 15) {
          s.alive = false; o.kills++; addBurst(s.x, s.y, colMain);
          pushFeed(`${o.name} eliminated ${s.name}!`);
          s.pts.forEach((p, idx) => { if (idx % 3 === 0) state.orbs.push(spawnOrb(p.x, p.y, true)); });
          break;
        }
      }
      if (!s.alive) break;
    }
  }
  state.snakes = state.snakes.map(s =>
    s.isBot && !s.alive ? makeSnake(s.id, s.name, s.skin, true) : s
  );
  while (state.orbs.length < ORB_MAX) state.orbs.push(spawnOrb());
  while (state.powerups.length < 3) state.powerups.push(spawnPowerup());

  if (dc && dc.readyState === "open") {
    const slim = {
      orbs: state.orbs, powerups: state.powerups, feed: state.feed,
      snakes: state.snakes.map(s => ({
        id: s.id, name: s.name, x: s.x, y: s.y, ang: s.ang, mass: s.mass,
        skin: s.skin, alive: s.alive, boost: s.boost, kills: s.kills,
        magT: s.magT, ghostT: s.ghostT,
        pts: s.pts.filter((_, i) => i % 2 === 0)
      }))
    };
    dc.send(JSON.stringify({ type: "state", data: slim }));
  }
}
function getLocalInput() {
  const me = state.snakes.find(s => s.id === myId);
  if (me && me.alive) {
    if (keys["ArrowLeft"] || keys["a"]) desiredAng -= 0.065;
    else if (keys["ArrowRight"] || keys["d"]) desiredAng += 0.065;
    else if (mouse.active) desiredAng = Math.atan2(mouse.y - me.y, mouse.x - me.x);
  }
  return {
    type: "input", ang: desiredAng, skin: skinIdx,
    boost: !!(keys[" "] || keys["ArrowUp"] || keys["w"] || mouse.down || touchBoost),
    respawn: !!(keys[" "] && me && !me.alive)
  };
}

const canvas = document.getElementById("arena");
const ctx = canvas.getContext("2d");
window.onkeydown = e => {
  keys[e.key] = true;
  if (["ArrowLeft", "ArrowRight", "a", "d"].includes(e.key)) mouse.active = false;
  if (e.key.toLowerCase() === "c") skinIdx = (skinIdx + 1) % SKINS.length;
};
window.onkeyup = e => { keys[e.key] = false; };
canvas.onmousemove = e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
  mouse.active = true;
};
canvas.onmousedown = () => { mouse.down = true; };
window.onmouseup = () => { mouse.down = false; };

const joyBase = document.getElementById("joyBase");
const joyKnob = document.getElementById("joyKnob");
joyBase.ontouchmove = e => {
  e.preventDefault();
  const t = e.touches, rect = joyBase.getBoundingClientRect();
  const dx = t.clientX - (rect.left + 55), dy = t.clientY - (rect.top + 55);
  const dist = Math.min(34, Math.hypot(dx, dy)), ang = Math.atan2(dy, dx);
  joyKnob.style.left = (31 + Math.cos(ang) * dist) + "px";
  joyKnob.style.top = (31 + Math.sin(ang) * dist) + "px";
  mouse.active = false; desiredAng = ang;
};
joyBase.ontouchend = () => { joyKnob.style.left = "31px"; joyKnob.style.top = "31px"; };
const tBoostBtn = document.getElementById("touchBoost");
tBoostBtn.ontouchstart = e => {
  e.preventDefault(); touchBoost = true;
  const me = state.snakes.find(s => s.id === myId);
  if (me && !me.alive) keys[" "] = true;
};
tBoostBtn.ontouchend = () => { touchBoost = false; keys[" "] = false; };

function loop() {
  if (isHost) {
    const inp = getLocalInput();
    const me = state.snakes.find(s => s.id === "p1");
    if (me && !me.alive && inp.respawn) Object.assign(me, makeSnake("p1", me.name, skinIdx));
    stepHost();
  } else if (dc && dc.readyState === "open") {
    dc.send(JSON.stringify(getLocalInput()));
  }
  draw();
  requestAnimationFrame(loop);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "#161E31"; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 45) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 45) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  for (let o of state.orbs) {
    ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = o.c; ctx.fillStyle = o.c;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  for (let p of (state.powerups || [])) {
    const col = p.type === "magnet" ? "#FBBF24" : "#A855F7";
    ctx.save(); ctx.shadowBlur = 16; ctx.shadowColor = col; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0B0F19"; ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
    ctx.fillText(p.type === "magnet" ? "M" : "G", p.x, p.y + 4); ctx.restore();
  }

  particles = particles.filter(p => --p.life > 0);
  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    ctx.fillStyle = p.c; ctx.globalAlpha = p.life / 28;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const ranked = state.snakes.filter(s => s.alive).sort((a, b) => b.mass - a.mass);
  const leaderId = ranked ? ranked.id : null;

  for (let s of state.snakes) {
    if (!s.alive) continue;
    const cols = SKINS[s.skin % SKINS.length].c;
    const rad = Math.min(18, 9 + (s.mass - 240) / 170);
    ctx.globalAlpha = s.ghostT > 0 ? 0.45 : 1.0;

    if (s.magT > 0) {
      ctx.strokeStyle = "rgba(251, 191, 36, 0.25)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(s.x, s.y, rad + 150, 0, Math.PI * 2); ctx.stroke();
    }

    for (let i = s.pts.length - 1; i >= 0; i--) {
      ctx.fillStyle = s.boost && i % 2 === 0 ? "#FFFFFF" : cols[i % 3];
      ctx.beginPath(); ctx.arc(s.pts[i].x, s.pts[i].y, rad, 0, Math.PI * 2); ctx.fill();
    }
    const ed = rad * 0.65, er = Math.max(3, rad * 0.3);
    for (let side of [-1, 1]) {
      const ex = s.x + Math.cos(s.ang + side * 0.55) * ed;
      const ey = s.y + Math.sin(s.ang + side * 0.55) * ed;
      ctx.save(); ctx.shadowBlur = 14; ctx.shadowColor = cols; ctx.fillStyle = "#FFF";
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = "#0B0F19";
      const px = ex + Math.cos(s.ang) * (er * 0.35), py = ey + Math.sin(s.ang) * (er * 0.35);
      ctx.beginPath(); ctx.arc(px, py, er * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = s.id === myId ? "#00F0FF" : "#CBD5E1";
    ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
    ctx.fillText((s.id === leaderId ? "👑 " : "") + s.name, s.x, s.y - rad - 10);
  }

  const top5 = ranked.slice(0, 5), bx = W - 195, by = 14;
  ctx.fillStyle = "rgba(17, 24, 39, 0.88)"; ctx.fillRect(bx, by, 180, 34 + top5.length * 20);
  ctx.strokeStyle = "#1E293B"; ctx.strokeRect(bx, by, 180, 34 + top5.length * 20);
  ctx.fillStyle = "#FBBF24"; ctx.font = "bold 11px monospace"; ctx.textAlign = "center";
  ctx.fillText("LIVE LEADERBOARD", bx + 90, by + 18);
  top5.forEach((s, idx) => {
    const yp = by + 38 + idx * 20;
    ctx.fillStyle = s.id === myId ? "#00F0FF" : "#CBD5E1";
    ctx.textAlign = "left"; ctx.fillText(`#${idx + 1} ${s.name.slice(0, 10)}`, bx + 10, yp);
    ctx.textAlign = "right"; ctx.fillText(s.mass, bx + 170, yp);
  });

  (state.feed || []).forEach((f, idx) => {
    ctx.fillStyle = "#FF2A85"; ctx.font = "bold 12px monospace"; ctx.textAlign = "left";
    ctx.fillText("⚡ " + f.text, 16, 48 + idx * 18);
  });

  const mx = W - 62, my = H - 62, mr = 46;
  ctx.fillStyle = "rgba(17, 24, 39, 0.85)";
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#334155"; ctx.stroke();
  for (let s of ranked) {
    const rx = mx - mr + (s.x / W) * (mr * 2), ry = my - mr + (s.y / H) * (mr * 2);
    ctx.fillStyle = s.id === myId ? "#00F0FF" : (s.isBot ? "#FF2A85" : "#39FF14");
    ctx.beginPath(); ctx.arc(rx, ry, s.id === myId ? 3.5 : 2.5, 0, Math.PI * 2); ctx.fill();
  }

  const me = state.snakes.find(s => s.id === myId);
  if (me) {
    document.getElementById("massHud").textContent = "MASS: " + me.mass;
    document.getElementById("killHud").textContent = "TAKEDOWNS: " + me.kills;
    if (me.magT > 0) {
      ctx.fillStyle = "#FBBF24"; ctx.fillRect(16, H - 32, (me.magT / 480) * 140, 8);
      ctx.font = "bold 10px monospace"; ctx.textAlign = "left"; ctx.fillText("2X MAGNET", 16, H - 37);
    }
    if (me.ghostT > 0) {
      ctx.fillStyle = "#A855F7"; ctx.fillRect(16, H - 16, (me.ghostT / 360) * 140, 8);
      ctx.font = "bold 10px monospace"; ctx.textAlign = "left"; ctx.fillText("GHOST PHASE", 16, H - 20);
    }
    if (!me.alive) {
      ctx.fillStyle = "rgba(11,15,25,0.85)"; ctx.fillRect(260, 210, 400, 180);
      ctx.strokeStyle = "#00F0FF"; ctx.strokeRect(260, 210, 400, 180);
      ctx.fillStyle = "#FF2A85"; ctx.font = "bold 26px monospace"; ctx.textAlign = "center";
      ctx.fillText("ELIMINATED!", W / 2, 270);
      ctx.fillStyle = "#F8FAFC"; ctx.font = "14px monospace";
      ctx.fillText("Press [SPACE] or Tap BOOST to Respawn", W / 2, 330);
    }
  }
}
</script>
